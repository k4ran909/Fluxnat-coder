[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "smartagent"
version = "0.2.0"
description = "SmartAGENT - Agentic AI Cybersecurity Scanner powered by Fluxnat Coder 3B"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [
    { name = "Fluxnat Team" }
]
keywords = ["cybersecurity", "vulnerability-scanner", "llm", "code-analysis", "sast", "fine-tuning"]

dependencies = [
    "torch>=2.1.0",
    "transformers>=4.45.0",
    "accelerate>=0.34.0",
    "bitsandbytes>=0.43.0",
    "peft>=0.12.0",
    "trl>=0.11.0",
    "datasets>=3.0.0",
    "typer[all]>=0.12.0",
    "rich>=13.8.0",
    "pydantic>=2.8.0",
    "requests>=2.31.0",
    "pyyaml>=6.0.1",
    "huggingface-hub>=0.25.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "ruff>=0.6.0",
]
training = [
    "unsloth",
    "wandb>=0.17.0",
    "scipy",
]

[project.scripts]
smartagent = "smartagent.cli:app"

[tool.setuptools.packages.find]
where = ["."]
include = ["smartagent*"]
