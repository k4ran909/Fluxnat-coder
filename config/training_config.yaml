# Fluxnat Coder 3B Training Configuration
# Optimized for Google Colab Free Tier (16GB T4 GPU) & Local RTX GPUs

project:
  name: "Fluxnat-Coder-3B"
  organization: "fluxnat"
  hub_model_id: "k4ran909/Fluxnat-Coder-3B"
  base_model: "k4ran909/Fluxnat-Coder-3B"
  output_dir: "./outputs/Fluxnat-Coder-3B"
  save_merged: true
  export_gguf: true

model:
  max_seq_length: 4096
  load_in_4bit: true
  dtype: "float16" # or "bfloat16" for Ampere/Ada/Hopper architectures

lora:
  r: 16
  lora_alpha: 32
  lora_dropout: 0.05
  bias: "none"
  target_modules:
    - "q_proj"
    - "k_proj"
    - "v_proj"
    - "o_proj"
    - "gate_proj"
    - "up_proj"
    - "down_proj"

training:
  per_device_train_batch_size: 2
  gradient_accumulation_steps: 4
  warmup_ratio: 0.1
  max_steps: 25 # Capped at 25 steps to preserve healthy entropy (~0.60-0.80 loss)
  num_train_epochs: 2
  learning_rate: 0.0001
  lr_scheduler_type: "cosine"
  weight_decay: 0.01
  logging_steps: 2
  save_strategy: "steps"
  save_steps: 25
  save_total_limit: 2
  fp16: true
  bf16: false
  optim: "adamw_8bit"
  seed: 3407

datasets:
  # Primary datasets for domain adaptation & instruction tuning
  sources:
    - name: "WhitzardAgent/CyberSecurity-1M"
      type: "qa"
      sample_limit: 25000
    - name: "soham-dahivalkar/cyber-threat-intelligence"
      type: "cti"
      sample_limit: 15000
    - name: "local_cot"
      path: "./data/custom_cot/security_cot.jsonl"
      type: "cot"
      sample_limit: 5000

system_identity:
  name: "Fluxnat Coder 3B"
  author: "Fluxnat"
  prompt: >
    You are Fluxnat Coder 3B, an elite AI cybersecurity and secure coding intelligence model created by Fluxnat.
    Your mission is to perform rigorous source code vulnerability auditing, identify CWE and OWASP Top 10 security flaws,
    explain attack surfaces and root causes using detailed step-by-step reasoning, and provide production-ready secure remediations.
